# Delegating a Project tree to an agent: a proxy plus one of two agents.
#
#   agent        runs the task with Claude (runner/, the Claude Agent SDK).
#   agent-local  runs it with a local model on your Mac (runner-local/, our own loop),
#                through LM Studio or another OpenAI-compatible server.
#
# Either agent sits on the internal "sandbox" network only, so it cannot reach anything
# directly: not the internet, not your Mac, not your LAN. It sees only the run's input
# (read-only), outbox and exchange folders.
#
#   proxy        is the agent's only way out. It holds the API key and forwards Claude API
#                calls, forwards /local to the model server on your Mac (the one exception
#                to "nothing on your Mac"), tunnels other HTTP(S) to public addresses,
#                refuses local ones, and logs everything.
#
# Run from this folder:  RUN_DIR=./runs/demo docker compose run --rm --build agent
#                   or:  RUN_DIR=./runs/demo docker compose run --rm --build agent-local
# AGENT_OFFLINE=1 cuts the internet off entirely: only the local model stays reachable.
# See README.md.

name: dragonglass-agent

services:
  proxy:
    build: ./proxy
    environment:
      # Needed for Claude runs only; without it the proxy refuses Claude API calls.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROXY_LOG: /logs/requests.jsonl
      # The one route to your Mac, for agent-local: the model server and nothing else.
      LOCAL_MODEL_UPSTREAM: ${LOCAL_MODEL_UPSTREAM:-http://host.docker.internal:1234}
      LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY:-}
      PROXY_OFFLINE: ${AGENT_OFFLINE:-0}
    volumes:
      - ${RUN_DIR:?Set RUN_DIR to the run folder, e.g. ./runs/demo}/logs:/logs
    networks: [sandbox, egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64

  agent:
    build: ./runner
    depends_on: [proxy]
    environment:
      # The key never enters this container: the proxy replaces the placeholder.
      ANTHROPIC_BASE_URL: http://proxy:8080
      ANTHROPIC_API_KEY: placeholder-the-proxy-adds-the-real-key
      HTTPS_PROXY: http://proxy:8080
      HTTP_PROXY: http://proxy:8080
      https_proxy: http://proxy:8080
      http_proxy: http://proxy:8080
      NO_PROXY: proxy
      no_proxy: proxy
      # Node's own fetch only honours the proxy variables when asked to.
      NODE_USE_ENV_PROXY: "1"
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      AGENT_EFFORT: ${AGENT_EFFORT:-high}
      AGENT_MAX_BUDGET_USD: ${AGENT_MAX_BUDGET_USD:-5}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-80}
      AGENT_ANSWER_TIMEOUT_MINUTES: ${AGENT_ANSWER_TIMEOUT_MINUTES:-240}
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      - ${RUN_DIR}/input:/workspace/input:ro
      - ${RUN_DIR}/outbox:/workspace/outbox
      - ${RUN_DIR}/exchange:/workspace/exchange
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /home/node:rw,nosuid,size=512m,uid=1000,gid=1000
    networks: [sandbox]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  agent-local:
    build: ./runner-local
    depends_on: [proxy]
    environment:
      LOCAL_MODEL_BASE_URL: http://proxy:8080/local/v1
      # Empty takes the first model the server lists, i.e. the one loaded in LM Studio.
      LOCAL_MODEL: ${LOCAL_MODEL:-}
      AGENT_OFFLINE: ${AGENT_OFFLINE:-0}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-60}
      AGENT_MAX_MINUTES: ${AGENT_MAX_MINUTES:-120}
      AGENT_ANSWER_TIMEOUT_MINUTES: ${AGENT_ANSWER_TIMEOUT_MINUTES:-240}
      LOCAL_CONTEXT_CHARS: ${LOCAL_CONTEXT_CHARS:-100000}
      LOCAL_MAX_REPLY_TOKENS: ${LOCAL_MAX_REPLY_TOKENS:-8192}
      HTTPS_PROXY: http://proxy:8080
      HTTP_PROXY: http://proxy:8080
      https_proxy: http://proxy:8080
      http_proxy: http://proxy:8080
      NO_PROXY: proxy
      no_proxy: proxy
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - ${RUN_DIR}/input:/workspace/input:ro
      - ${RUN_DIR}/outbox:/workspace/outbox
      - ${RUN_DIR}/exchange:/workspace/exchange
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /home/node:rw,nosuid,size=512m,uid=1000,gid=1000
    networks: [sandbox]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  # The same kind of run as agent-local, with Hugging Face's smolagents CodeAgent as the harness.
  agent-smol:
    build: ./runner-smol
    depends_on: [proxy]
    environment:
      LOCAL_MODEL_BASE_URL: http://proxy:8080/local/v1
      LOCAL_MODEL: ${LOCAL_MODEL:-}
      AGENT_OFFLINE: ${AGENT_OFFLINE:-0}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-60}
      AGENT_MAX_MINUTES: ${AGENT_MAX_MINUTES:-120}
      AGENT_ANSWER_TIMEOUT_MINUTES: ${AGENT_ANSWER_TIMEOUT_MINUTES:-240}
      LOCAL_MAX_REPLY_TOKENS: ${LOCAL_MAX_REPLY_TOKENS:-8192}
      SMOL_PLANNING_INTERVAL: ${SMOL_PLANNING_INTERVAL:-5}
      HTTPS_PROXY: http://proxy:8080
      HTTP_PROXY: http://proxy:8080
      https_proxy: http://proxy:8080
      http_proxy: http://proxy:8080
      NO_PROXY: proxy
      no_proxy: proxy
    volumes:
      - ${RUN_DIR}/input:/workspace/input:ro
      - ${RUN_DIR}/outbox:/workspace/outbox
      - ${RUN_DIR}/exchange:/workspace/exchange
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /home/agent:rw,nosuid,size=512m,uid=1000,gid=1000
    networks: [sandbox]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

networks:
  # No route out: the agent reaches only the proxy.
  sandbox:
    internal: true
  egress: {}
